name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: 6.12.0

jobs:
  windows:
    name: windows-x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O C:\Qt

      - name: Configure
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH=C:/Qt/${{ env.QT_VERSION }}/msvc2022_64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Deploy Qt and build installer
        shell: pwsh
        run: |
          $qtBin = "C:\Qt\$env:QT_VERSION\msvc2022_64\bin"
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          Copy-Item build\Release\dbhx-player.exe dist\windows\
          & "$qtBin\windeployqt.exe" --release --qmldir qml dist\windows\dbhx-player.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          Set-Content -Path dist\version.nsh -Encoding ASCII `
            -Value "!define VERSION `"$version`"`r`n!define ARCH `"x64`""

          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" scripts\dbhx-player.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*Setup.exe
          if-no-files-found: error

  macos:
    name: macos-universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt
        run: |
          python -m pip install --disable-pip-version-check aqtinstall
          python -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -O "$HOME/Qt"

      - name: Build dmg
        run: |
          command -v ninja >/dev/null || brew install ninja
          chmod +x scripts/package-macos.sh
          scripts/package-macos.sh "$HOME/Qt/$QT_VERSION/macos"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/__VERSION__/${version}/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/*Setup.exe
            dist/*.dmg