name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: windows-x64
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-multimedia-wmf
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-nsis

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=C:/msys64/ucrt64
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Deploy Qt and build installer
        run: |
          rm -rf dist
          mkdir -p dist/windows
          cp build/dbhx-player.exe dist/windows/
          windeployqt --release --compiler-runtime --qmldir qml dist/windows/dbhx-player.exe

          version=$(grep -m1 -E '^[[:space:]]+VERSION [0-9]' CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          printf '!define VERSION "%s"\r\n!define ARCH "x64"\r\n' "$version" > dist/version.nsh
          makensis scripts/dbhx-player.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*Setup.exe
          if-no-files-found: error

  macos:
    name: macos-universal
    runs-on: macos-15
    env:
      # Qt 6.12 has no open-source binary packages yet; 6.9.3 is the newest
      # official universal build and is API-compatible with this project.
      QT_VERSION: 6.9.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt
        run: |
          python -m pip install --disable-pip-version-check aqtinstall
          python -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -O "$HOME/Qt" \
            --modules qtmultimedia qt5compat

      - name: Build dmg
        run: |
          command -v ninja >/dev/null || brew install ninja
          chmod +x scripts/package-macos.sh
          scripts/package-macos.sh "$HOME/Qt/$QT_VERSION/macos"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/__VERSION__/${version}/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/*Setup.exe
            dist/*.dmg