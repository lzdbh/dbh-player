name: P0 Spike · 三平台构建验证

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  s3-media-server:
    name: S3 · HTTP 206 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike/media-server
      - name: Build S3
        working-directory: spike/media-server
        run: cargo build --locked
      - name: Verify 206 / 416 (Linux runner)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          cd spike/media-server
          head -c 524288 /dev/urandom > /tmp/sample.bin
          ./target/debug/cast-media-spike /tmp/sample.bin ci-token 18765 &
          PID=$!
          for i in $(seq 1 30); do
            curl -sf "http://127.0.0.1:18765/health?token=ci-token" >/dev/null && break
            sleep 1
          done
          echo "--- Range 100-199 ---"
          curl -sS -D - -o /dev/null -H "Range: bytes=100-199" \
            "http://127.0.0.1:18765/media/sample?token=ci-token" \
            | grep -Ei "HTTP/|content-range|content-length|accept-ranges"
          echo "--- unsatisfiable range ---"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" -H "Range: bytes=99999999-" \
            "http://127.0.0.1:18765/media/sample?token=ci-token"
          kill $PID || true

  s1-tauri-overlay:
    name: S1 · 透明窗口工程 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike/tauri-overlay
      - name: Linux system deps (WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Install Tauri CLI
        working-directory: spike/tauri-overlay
        run: npm ci
      - name: Build Rust side (locked)
        working-directory: spike/tauri-overlay
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked 2>&1 | tee build.log || {
            tail -40 build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Validate Tauri config via CLI
        working-directory: spike/tauri-overlay
        run: npm run tauri -- info

  cast-loop:
    name: 模拟 DLNA 闭环 (Linux runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build S3 media server
        working-directory: spike/media-server
        run: cargo build --locked
      - name: Run cast loop (renderer + controller + 206 pull)
        shell: bash
        run: |
          set -e
          cd spike/cast-loop
          python cast_loop_test.py --media-server ../media-server/target/debug/cast-media-spike

  libmpv-probe:
    name: S1b · libmpv DLL probe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download mpv dev package from GitHub releases
        shell: pwsh
        run: |
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261106/mpv-dev-x86_64-20261106-git-9028187538.7z"
          Invoke-WebRequest -Uri $url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev -y
          Get-ChildItem -Recurse mpv-dev -Filter "*mpv*.dll" | Select-Object -ExpandProperty FullName
      - name: Probe libmpv C API
        shell: bash
        run: |
          set -e
          DLL=$(find mpv-dev -iname "*mpv*.dll" | head -1)
          test -n "$DLL"
          python spike/libmpv-probe/probe.py --dll "$DLL"
