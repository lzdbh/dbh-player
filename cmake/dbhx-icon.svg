<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="screen" x1="512" y1="238" x2="512" y2="706" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67c4ff"/>
      <stop offset="0.46" stop-color="#2f8cf0"/>
      <stop offset="1" stop-color="#145bc0"/>
    </linearGradient>
    <linearGradient id="rim" x1="300" y1="226" x2="724" y2="718" gradientUnits="userSpaceOnUse">
